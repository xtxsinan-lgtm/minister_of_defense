# 地面车辆型号：坦克、步战车、装输、突击炮、轻型战术车、卡车
# ratings 引用 schema/rating_scales.yaml；未注明的数值即原文未给出。

models:
  # ======================= 美国 · 坦克 =======================
  - id: m1a1_sa
    name: M1A1 SA
    category: mbt
    family: m1_abrams
    origin: USA
    crew: 4            # 车长、炮长、驾驶员、装填手
    notes: 美军现役约 1/4。
  - id: m1a2_sepv2
    name: M1A2 SEPv2
    category: mbt
    family: m1_abrams
    origin: USA
    crew: 4
    ratings: {protection: mbt_m1a2_sepv2, firepower: fp_99a, fire_control: fc_auto_track}
    notes: 美军现役一半以上。相比 A1 SA 装甲更好、车长独立热成像火控（猎-歼），可连续对两个目标射击，车内显示改善。原文战力计算中美军重型旅统一按此型。
  - id: m1a2_sepv3
    name: M1A2 SEPv3
    category: mbt
    family: m1_abrams
    origin: USA
    crew: 4
    notes: 约占 1/4。大幅改善发电和数字化能力，装甲进一步改善。技术水平与 99A 类似。

  # ======================= 美国 · 步战车 / 装输 =======================
  - id: m2a2
    name: M2A2 布雷德利
    category: ifv
    family: m2_bradley
    origin: USA
    crew: 3
    capacity: 6
    armament: [25mm M242 大毒蛇机炮, 双联 TOW 发射器（备弹 7 发）, 同轴机枪]
    ratings: {protection: prot_25mm_front_127ap}
    specs: {front_protection: 30mm 脱壳穿甲弹及 RPG}
    notes: 相比之前型号增强装甲和外挂爆反能力，增强动力。TOW 装填需打开乘员舱上方舱门，装填慢且有破片风险。
  - id: m2a3
    name: M2A3 布雷德利
    category: ifv
    family: m2_bradley
    origin: USA
    crew: 3
    capacity: 6
    armament: [25mm M242 机炮, 双联 TOW（备弹 7）, 同轴机枪]
    ratings: {protection: prot_30mm_front_25mm, firepower: fp_25mm_atgm, fire_control: fc_auto_track}
    notes: 进一步增强装甲，大幅改善火控、观瞄和信息化；车长独立观瞄、导航地图，乘员舱显示屏可看全车观瞄图像。保护档按美军普遍加装附加装甲计。
  - id: m2a4
    name: M2A4 布雷德利
    category: ifv
    family: m2_bradley
    origin: USA
    crew: 3
    capacity: 6
    notes: 增强动力和悬挂以适应更大重量，增加 IED 干扰器。少量装备。
  - id: m2a3_scout
    name: M2A3（营侦察排，加装 LRAS3）
    category: recon_ifv
    family: m2_bradley
    origin: USA
    crew: 3
    capacity: 3
    sensors: [lras3]
  - id: m3a3
    name: M3 布雷德利骑兵战车
    category: recon_ifv
    family: m2_bradley
    origin: USA
    crew: 3
    capacity: 3
    sensors: [lras3]
    notes: 带 LRAS3 光电侦察设备，TOW 备弹更多。
  - id: m113a3
    name: M113A3
    category: apc
    family: m113
    origin: USA
    notes: 仍为大部分单位的勤务装甲车；AMPV 替换不到 1/10，且 AMPV 项目已取消。
  - id: ampv
    name: AMPV
    category: apc
    family: ampv
    origin: USA
    notes: 基于布雷德利底盘的 M113 替代品，项目已取消。
  - id: m1126_icv
