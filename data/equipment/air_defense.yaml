# 防空型号：高炮、弹炮合一、防空导弹
# 原文防空评估指标：最大射程、最大射高、导弹速度、每车发射架数（各 25%），
# 再以制导方式和展开时间修正。制导档位从高到低：
#   cmd_arh（指令+主动雷达）> cmd_sarh_or_ir（指令+半主动雷达或红外）> sarh（半主动雷达）> ir（被动红外）

models:
  # ======================= 美国 =======================
  - id: pac2
    name: 爱国者 PAC-2
    category: sam_long
    family: patriot
    origin: USA
    specs: {range_km: 160, ceiling_km: 32, speed_mach: 3.5, guidance: sarh, rails_per_launcher: 4, deploy_min: 60}
  - id: pac3
    name: 爱国者 PAC-3
    category: sam_long
    family: patriot
    origin: USA
    specs: {range_km: 80, ceiling_km: 24, guidance: cmd_arh, rails_per_launcher: 4, deploy_min: 60}
    notes: 美国目前装备最多的是性能最差的 PAC-3 低成本版本。
  - id: pac3_mse
    name: 爱国者 PAC-3 MSE
    category: sam_long
    family: patriot
    origin: USA
    specs: {range_km: 120, ceiling_km: 36, guidance: cmd_arh, rails_per_launcher: 4, deploy_min: 60, cost_musd_per_launcher: 4}
    notes: 原文防空导弹战力基准；每营 2.4 亿美元，按发射车折算每车 400 万美元。
  - id: nasams
    name: NASAMS
    category: sam_medium
    family: nasams
    origin: USA
    specs: {range_km: [30, 60], ceiling_km: 21, speed_mach: 4, rails_per_launcher: [4, 6], guidance: cmd_arh}
    notes: 陆基发射 AIM-120。
  - id: m_shorad
    name: M-SHORAD 斯崔克防空车
    category: spaag
    family: stryker
    origin: USA
    specs: {missile: stinger, rails_per_launcher: 2, missile_range_km: 8, missile_ceiling_km: 3.8, cost_musd: 6}
    notes: 原文高炮/弹炮战力基准，每车 600 万美元。
  - id: avenger
    name: 复仇者车载便导
    category: sam_vehicle_manpads
    family: avenger
    origin: USA
    specs: {missile: stinger, launch_pods: 2, missile_range_km: 8, missile_ceiling_km: 3.8, speed_mach: 2.2}
  - {id: c_ram, name: C-RAM, category: c_ram, family: phalanx, origin: USA}
  - {id: thaad, name: 萨德, category: sam_long, family: thaad, origin: USA, notes: 美陆军有 7 个独立萨德连。}
  - {id: gmd, name: 陆基中段反导系统, category: sam_long, family: gmd, origin: USA, notes: 国民警卫队 1 个营。}

