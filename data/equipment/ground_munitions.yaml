# 地面弹药型号（DC-206 ①：类别组 ground_munition，见 data/schema/categories.yaml）
# 规格：03 §3.1 MunitionProfile（YAML 键 munition）、03 §5.7 参考弹药表、06 §3.1 Ammunition 库存（按发/枚计）、00 §4.3（弹药也是 EquipmentModel）。
# 弹药不进班模板槽位；武器型号通过 munitions / weapon.munitions 引用这里的 id（03 WeaponProfile.munitions、defaultLoad）。
#
# 本文件只填“型号身份”：类别、口径、MunitionKind（snake_case，00 §5 枚举映射）与公开来源可查的弹体参数。
#   03 §5.7 的效能矩阵（effect / penetration_mm / alloc_value 等）全部是 estimated，由 03/14 的数据任务填入 munition 键，不在这里臆造。
#   round_weight_kg（06 运输重量）同样待数据任务补；缺省时 06 按类别默认值。
# 来源键同 nk_models.yaml 文件头（wp_<页面> = 英文维基百科同名条目，访问 2026-10）。
# confidence：未写 = stated（来源直接给出）。

