# 纳卡战区（阶段 1 MVP）新增装备型号：亚美尼亚、阿塞拜疆及其主要供应国装备
# 格式：data/README.md「装备型号」+ docs/spec/01_org_templates.md §3.3（可选 service_year / upgrade_of / maintenance_group，01 M3）。
# 只使用 data/schema/categories.yaml 现有类别。需要新类别（loitering_munition、tbm_launcher，01 M2）的型号
#   在 data/equipment_pending/nk_models_m2.yaml，等 M2 迁移后移入本目录（否则 tools/validate_data.py 报错）。
#
# confidence 约定（本文件）：stated = 下列公开来源直接给出；estimated = 依据注明的推算；uncertain = 来源互相矛盾。
#   原文 README 的 stated 指“知乎原文”，本文件改指下列公开来源（14 §3.2）。
# origin：苏联设计统一写 RUS（与现有 tor_m1 一致），notes 注明“苏联设计”。
# 单价、可采购年份等采购属性不放这里，放 data/scenarios/nk_common/procurement.yaml（11 的 ProcurementProfile）。
#
# 来源（每个型号的 src 字段引用这里的键）：
#   wp_<页面>  = 英文维基百科同名条目（型号的基本参数：口径、射程、乘员、载员），访问 2026-10
#   fm100_2_3  = US Army FM 100-2-3 (1991) https://irp.fas.org/doddir/army/fm100-2-3.pdf
#   wp_arm_eq_2020 = https://en.wikipedia.org/w/index.php?oldid=973047801 （List of equipment of the Armenian Armed Forces，2020-08-15 修订版）
#   wp_aze_eq_2020 = https://en.wikipedia.org/w/index.php?oldid=977340066 （List of equipment of the Azerbaijani Land Forces，2020-09-08 修订版）

models:
