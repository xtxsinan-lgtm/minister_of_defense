# ======================= 非制导航弹（原文定性描述）=======================
unguided_bombs:
  CHN:
    low_drag_he: 3 型低阻杀爆航弹（战斗机用，低威胁低空投弹）
    retarded_he: 4 型减速杀爆航弹
    high_drag_he_kg: [250, 500, 1000, 3000]   # 3000kg 为轰炸机用
    anti_runway: [200-4 型（200kg 级，减速伞）, BETAB-500（500kg 级，俄引进）]
    cluster: [集束-3（反装甲，250kg 级）, 集束-4（反跑道，250kg 级）]
    incendiary: [1 型、2 型高阻燃烧弹, 3 型低阻燃烧弹（250kg 级）]
    fuel_air: 250-1000kg 级战术云爆弹
    penetrator: 无（制导炸弹有）
  USA:
    high_drag_he_lb: [500, 1000, 2000]        # 低阻杀爆弹只剩制导版本
