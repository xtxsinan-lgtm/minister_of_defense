meta:
  summary: "兵力最庞大（现役约 128 万）、炮兵/多管火箭炮数量极大，但装备老旧、油料弹药与可用率存疑；战术/中程导弹发射车是主要的现代化打击力量；海军以大量小型潜艇/快艇为主，新下水的崔贤级驱逐舰（2 艘）是转折点。"
  caveat: "最不确定的一个国家：数量、可用率、后勤与训练都缺乏独立核实。"
