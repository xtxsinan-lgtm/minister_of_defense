# 水面舰艇火力折算系数：每件武器折合多少个“等效垂发单元（VLS）”。出处：作者表格“驱护舰”第 2 行（火力折算系数）。
# 近程防空/反潜/鱼雷三个系数在“分层级火力”快照里被冲掉了（近程防空显示为 0.0），这里按带实时公式的工作簿
# （中美军力对比!驱护舰 N2:P2）取 0.25。
# 防空导弹的系数 = 该型号的单位战力折算（防空旅!E18 等），例如红旗-9 0.64、红旗-16 0.49。
ship_weapon_coefficients:
  cell_htk1_deep: 2.0       # 深坑 HT-1（大型垂发，反舰/对陆巡航导弹）
  cell_htk1: 1.5            # HT-1
  cell_mk41: 1.0            # Mk 41 / Mk 57 / 通用垂发
  cell_sea_ram_riff: 0.71   # 里夫-M
  cell_hq9: 0.64            # 红旗-9
  cell_hq16: 0.49           # 红旗-16
  cell_shtkili: 0.44        # 施基利
  antiship_missiles: 1.0
  point_defense: 0.25       # 近程防空（海红旗-10 / SeaRAM / 小型垂发）
  asw_rocket: 0.25
  torpedoes: 0.25
