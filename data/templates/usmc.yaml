# ======================================================================
# MAGTF 编组（原文 1.4.1.1.3）—— 作为参考数据，不是严格的嵌套模板
# ======================================================================
magtf:
  MEF:
    components: [陆战师（地面作战部队 GCE）, 航空联队（航空作战部队 ACE）, 后勤群（LCE）, 远征军本部群]
    analogy: 结构上类似解放军一个战区（陆军 + 空军 + 联勤保障中心）
    aircraft_wing:
      fixed_wing_group: {fighter_squadrons: 6, tanker_squadrons: 1, uav_squadrons: 1, aircraft_per_fighter_sqn: 12, tanker: 12 × KC-130J, uav_2020: 5 × RQ-21（换装 MQ-9）}
      tiltrotor_group: {squadrons: [5, 6], aircraft_per_sqn: 12, type: MV-22}
      helicopter_group: {heavy_sqn: 2 × 12 CH-53E, light_attack_sqn: 2 × (18 AH-1Z + 9 UH-1Y)}
