# 阿塞拜疆苏式遗产编制模板
# 生成方式：tools 外的生成脚本（见 docs/spec/14_scenario_nk.md §3.6）；手改后请保持两国文件结构一致。
# 格式：data/README.md + docs/spec/01_org_templates.md §3.4.1（新增可选字段 branch / echelon_label / style）。
# 依据：苏军编制基准 US Army FM 100-2-3 (1991) https://irp.fas.org/doddir/army/fm100-2-3.pdf ；
#       亚、阿军继承苏式摩步团/旅（01 §4.17）。除注明外 confidence: estimated（后苏联军队普遍缺编、改编，
#       真实各营满编率由剧本的 ReadinessTier 与库存分配体现，不改模板）。
# 依赖 01 M2 新类别（loitering_launcher、tbm_launcher）的模板原在 data/templates_pending/，已并入本文件末尾（审查第 2 部分）。
# DC-205 ①：巡飞弹班的槽位写发射单元类别 loitering_launcher；巡飞弹本身（loitering_munition）是弹药，按枚计入 06 库存，不占槽位。
templates:
- id: aze_mr_bmp_sq
  name: BMP 摩步班（苏式 8 人）
  level: squad
  branch: mech_infantry
  personnel:
    squad_leader: 1
    vehicle_gunner: 1
    vehicle_driver: 1
    automatic_rifleman: 1
    at_gunner: 1
    assistant_gunner: 1
    rifleman: 2
  slots:
    ifv: 1
    rifle: 6
    lmg: 1
    reusable_launcher: 1
  slots_unassigned:
    disposable_launcher: 2
  notes: 班长兼车长；炮长、驾驶员留车；下车 5 人（RPK-74、RPG-7 + 副射手、2 名步枪手）。依据 FM 100-2-3 (1991) https://irp.fas.org/doddir/army/fm100-2-3.pdf 的 BMP 摩步班；后苏联时期常缺编。
  confidence: estimated
