# 解放军其他陆上单位（原文 1.3.5.2、1.4.2）
# 每个单位都拆到原文描述的最低一级；原文只给到营/连名称的，就以该级为叶子（children 为空或用 pla_generic_sq 占位）。
# 通用车辆班 pla_vsq_* 和合成营各级模板定义在 pla_army_brigade.yaml。

templates:

  # ##################################################################
  # 一、集团军直属旅
  # ##################################################################

  # ---------------- 炮兵旅 ----------------
  - id: pla_how155_coy
    name: 155 榴弹炮连
    level: company
    children: [{template: pla_vsq_howitzer_heavy_sp, count: 6}]
    notes: 每连 6 门（新疆合成师“3 个 PCL-181 连共 18 门”）。PLZ-05 自行或 PCL-181 车载（实例中换 pla_vsq_howitzer_heavy_truck）。
  - id: pla_how155_bn
    name: 155 榴弹炮营
    level: battalion
    children: [{template: pla_how155_coy, count: 3}]
    default_bindings: {howitzer_heavy_sp: plz05, howitzer_heavy_truck: pcl181}
    notes: 每营 18 门 PLZ-05 或 PCL-181。
  - id: pla_phl03_bn
    name: PHL-03 远程火箭炮营
    level: battalion
    children: [{template: pla_vsq_mrl_long_range, count: 12}]
    default_bindings: {mrl_long_range: phl03}
    notes: 每营 12 门，每门 12 管 300mm。连级划分原文未给。
  - id: pla_phl191_bn
    name: PHL-191 模块化远程火箭炮营
    level: battalion
    children: [{template: pla_vsq_mrl_long_range, count: 16}]
    default_bindings: {mrl_long_range: phl191}
    notes: 每营 16 门，每门 3 个发射模块。
  - id: pla_gun130_bn
    name: 130 加农炮营（自海防部队转隶）
    level: battalion
    children: [{template: pla_vsq_howitzer_heavy_towed, count: 18}]
    default_bindings: {howitzer_heavy_towed: type59_130}
    confidence: estimated
    notes: 2026-06 注：至少 1 个；门数原文未给，按 155 营 18 门类推。
  - id: pla_arty_bde_cmd_spt_bn
    name: 炮兵旅指挥支援营
    level: battalion
    role: support
    children: [{template: pla_vsq_uav_tactical, count: 4}]
    confidence: estimated
    notes: 装备若干架 ASN-209 中型无人机（架数原文未给）。
  - {id: pla_svc_bn_generic, name: 勤务保障营, level: battalion, role: support, granularity: aggregate, children: []}
  - id: pla_ag_artillery_brigade
    name: 集团军炮兵旅
    level: brigade
    children:
      - {template: pla_how155_bn, count: 4}
      - {template: pla_phl03_bn, count: 1}
      - {template: pla_phl191_bn, count: 1}
      - {template: pla_arty_bde_cmd_spt_bn, count: 1}
      - {template: pla_svc_bn_generic, count: 1}
    notes: 2025-08 原文编制。
  - id: pla_ag_artillery_brigade_2026
    variant_of: pla_ag_artillery_brigade
    name: 集团军炮兵旅（2026-06 注）
    level: brigade
    children:
      - {template: pla_how155_bn, count: 6}
      - {template: pla_gun130_bn, count: 1}
      - {template: pla_phl03_bn, count: 1}
      - {template: pla_phl191_bn, count: 1}
      - {template: pla_arty_bde_cmd_spt_bn, count: 1}
      - {template: pla_svc_bn_generic, count: 1}
