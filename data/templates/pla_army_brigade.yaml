# 解放军陆军合成旅编制模板（原文 1.3.1–1.3.4）
# 重型 / 中型 / 轻高机 / 摩步 四种基本类型。字段说明见 data/README.md。
# 原文大量“估计”“猜测”的人数在 confidence 中标注。

templates:

  # ==================================================================
  # 班
  # ==================================================================
  - id: pla_tank_crew
    name: 坦克车组（自动装弹机，3 人）
    level: squad
    personnel: {tank_commander: 1, tank_gunner: 1, tank_driver: 1}
    slots: {mbt: 1}

  - id: pla_mech_inf_squad
    name: 重型/中型旅机步班（车组属班）
    level: squad
    personnel: {squad_leader: 1, vehicle_gunner: 1, vehicle_driver: 1, team_leader: 1, at_gunner: 1, assistant_gunner: 1, automatic_rifleman: 2, marksman: 1}
    slots: {ifv: 1, rifle: 2, underbarrel_gl: 1, reusable_launcher: 1, lmg: 2, dmr: 1, disposable_launcher: 2, radio_handheld: 1, uav_micro: 1}
    slots_unassigned: {disposable_launcher: 4}
    notes: >
      班长任车长、不下车；下车火力组 6 人由副班长带领：120 火箭筒射手 + 副射手（每次带 2 发）、2 名轻机枪手
      （各带 1 具 80mm 一次性火箭筒）、1 名精确射手。副射手和副班长持步枪，副班长另有枪挂榴弹发射器和步话机。
      另有 4 具 80mm 一次性火箭筒放车上。班长有时额外配霰弹枪。据说近期 120 火主射手也配步枪，车长、炮长必要时可下车。
      今年起班一级普遍装备微型共轴双旋翼无人机。单兵负重 35kg。

  - id: pla_mech_plt_fire_sq
    name: 重型/中型旅排火力班
    level: squad
    personnel: {mg_gunner: 1, assistant_gunner: 3, at_gunner: 1, rifleman: 2}
    slots: {gpmg: 1, reusable_launcher: 1, agl: 1, ifv: 1}
    notes: >
      通用机枪射手+副射手（88 式换 201 式 7.62mm）；120 火射手+副射手（未来可能换 82mm 无后坐力炮）；
      87 式自动榴弹发射器射手、副射手、弹药手（两脚架，12kg，600m）。
      每排 4 辆步战车，原文未说明第 4 车车组，这里把车挂在火力班上。

  - id: pla_plt_hq
    name: 排部（排长 + 通信员）
    level: squad
    role: hq
    personnel: {officer: 1, signaler: 1}

  - id: pla_light_inf_squad
    name: 轻高机旅步兵班（猛士）
    level: squad
    personnel: {squad_leader: 1, vehicle_gunner: 1, vehicle_driver: 1, team_leader: 1, at_gunner: 1, assistant_gunner: 1, automatic_rifleman: 2, marksman: 1}
    slots: {light_armored_vehicle: 1, rifle: 3, underbarrel_gl: 1, reusable_launcher: 1, lmg: 2, dmr: 1, disposable_launcher: 2, radio_handheld: 1, uav_micro: 1}
    slots_unassigned: {disposable_launcher: 4}
    notes: 炮长变为遥控武器站操作员；除驾驶员外 8 人都可下车。

  - id: pla_motor_inf_squad
    name: 摩步旅步兵班
    level: squad
    personnel: {squad_leader: 1, team_leader: 1, at_gunner: 1, assistant_gunner: 2, automatic_rifleman: 2, marksman: 1, rifleman: 1}
    slots: {rifle: 5, underbarrel_gl: 1, reusable_launcher: 1, lmg: 2, dmr: 1, disposable_launcher: 2, radio_handheld: 1}
    notes: 与轻高机班接近，无驾驶员和武器站操作员，120 火多 1 名副射手携带更多弹药。

  # ==================================================================
  # 排
  # ==================================================================
  - id: pla_tank_plt
    level: platoon
    children: [{template: pla_tank_crew, count: 4}]
    expected_personnel: 12

  - id: pla_mech_plt
    name: 重型/中型旅机步排
    level: platoon
    children:
      - {template: pla_mech_inf_squad, count: 3}
      - {template: pla_mech_plt_fire_sq, count: 1}
      - {template: pla_plt_hq, count: 1}
    expected_personnel: 36
    expected_equipment: {ifv: 4}
    confidence: estimated
    notes: 原文“估计 35-37 人”，后文定为 36。

  - id: pla_light_plt
    name: 轻高机旅步兵排（3 车）
    level: platoon
    children: [{template: pla_light_inf_squad, count: 3}, {template: pla_plt_hq, count: 1}]
    expected_personnel: 29
    notes: 无火力班、无排部车，排长和通信员分坐两个班的猛士空位。一般 2 车重机枪 + 1 车 35mm 榴弹发射器。

  - id: pla_motor_plt
    level: platoon
    children: [{template: pla_motor_inf_squad, count: 3}, {template: pla_plt_hq, count: 1}]
    expected_personnel: 29

  # ==================================================================
  # 连
  # ==================================================================
  - id: pla_tank_coy_hq
    name: 装甲连连部（除坦克外）
    level: squad
    role: hq
    personnel: {vehicle_driver: 1, political_officer: 1, staff: 1, signaler: 1, medic: 1, mechanic: 2}
    slots: {apc: 1, truck_medium: 1, utility_vehicle: 1}
    notes: 89 式装输乘指导员、文书、通信员、卫生员；1 辆 MV3 载弹药和 2 名军械员；连长平时有 1 辆勇士越野车。

  - id: pla_tank_coy
    name: 重型旅装甲连
    level: company
    children:
      - {template: pla_tank_plt, count: 3}
      - {template: pla_tank_crew, count: 2}      # 连长、副连长车
      - {template: pla_tank_coy_hq, count: 1}
    expected_personnel: 49
    expected_equipment: {mbt: 14}

  - id: pla_mech_coy_hq
    name: 机步连连部（1 辆步战车）
    level: squad
    role: hq
    personnel: {officer: 2, political_officer: 1, vehicle_driver: 1, vehicle_gunner: 1, staff: 1, signaler: 1, medic: 1}
    slots: {ifv: 1}
    notes: 连长任车长，另有驾驶员、炮长、操作员、副连长、指导员、文书、通信员、卫生员（原文列 9 个岗位但称连部 8 人）。营后勤连炊事排可能加强 1 个 3 人炊事组 + 野战炊事车。

  - id: pla_mech_coy
    name: 重型旅机步连
    level: company
    children: [{template: pla_mech_plt, count: 3}, {template: pla_mech_coy_hq, count: 1}]
    expected_personnel: 116
    expected_equipment: {ifv: 13}
    notes: 重型、中型旅连无火力排（火力下放到排火力班）。

  - id: pla_medium_mech_coy
    variant_of: pla_mech_coy
    name: 中型旅机步连（ZBL-08）
    level: company
    children: [{template: pla_mech_plt, count: 3}, {template: pla_mech_coy_hq, count: 1}]
    expected_personnel: 116

  - id: pla_assault_gun_coy
    variant_of: pla_tank_coy
    name: 中型旅突击炮连（ZTL-11）
    level: company
    children:
      - {template: pla_assault_gun_plt, count: 3}
      - {template: pla_assault_gun_crew, count: 2}
      - {template: pla_tank_coy_hq, count: 1}
    notes: 编制与装甲连类似。
  - id: pla_assault_gun_crew
    level: squad
    personnel: {vehicle_commander: 1, vehicle_gunner: 1, vehicle_driver: 1}
    slots: {assault_gun: 1}
    confidence: estimated
    notes: 原文未给突击炮乘员数，按装甲连 3 人车组类推。
  - {id: pla_assault_gun_plt, level: platoon, children: [{template: pla_assault_gun_crew, count: 4}]}

  # ---- 轻高机连 ----
  - id: pla_light_coy_hq
    level: squad
    role: hq
    personnel: {officer: 2, political_officer: 1, vehicle_driver: 2, staff: 1, signaler: 1}
    slots: {light_armored_vehicle: 1, truck_medium: 1}
    notes: 连部 7 人（少一名炮长），载车装甲猛士；补给卡车为 CTL-181。原文 7 人，这里含补给车驾驶员为 7。
  - id: pla_sniper_gl_sq_mounted
    name: 狙击榴弹发射器班（乘车）
    level: squad
    personnel: {squad_leader: 1, vehicle_driver: 1, mg_gunner: 6}
    slots: {light_armored_vehicle: 1, sniper_gl: 6}
    notes: 6 门 11 式狙击榴弹发射器，每门 1 人。
  - id: pla_hmg_sq_mounted
    name: 重机枪班（乘车）
    level: squad
    personnel: {squad_leader: 1, vehicle_driver: 1, mg_gunner: 2, assistant_gunner: 6}
    slots: {light_armored_vehicle: 1, hmg: 2}
    notes: 2 个 4 人重机枪组；89 式（26kg）正换装 171 式（17.8kg）。
  - id: pla_mortar60_sq_mounted
    name: 60 迫击炮班（乘车）
    level: squad
    personnel: {squad_leader: 1, vehicle_driver: 1, mortarman: 10}
    slots: {light_armored_vehicle: 1, mortar_light: 2}
    confidence: estimated
    notes: 2 门 PP-89；人数按连直属 39 人倒推（每门 5 人）。
  - id: pla_light_fire_plt
    name: 轻高机连火力排
    level: platoon
    children:
      - {template: pla_sniper_gl_sq_mounted, count: 1}
      - {template: pla_hmg_sq_mounted, count: 1}
      - {template: pla_mortar60_sq_mounted, count: 1}
      - {template: pla_plt_hq, count: 1}
    confidence: estimated
    notes: >
      火力排编制最不固定：见过“2 重机枪班 + 1 迫击炮班”“3 重机枪班 + 1 榴弹发射器班”“1 迫击炮班 + 1 榴弹发射器班”等说法；
      另有“全军步兵连火力排 6 种可选火力支援单元”的说法（60 迫、35mm 自动榴弹、12.7 重机枪、狙击枪、狙击榴弹、营用 120 火，未来可能有红箭-73）。
      此处采用原文推测：狙击榴弹班 + 重机枪班 + 60 迫班。
  - id: pla_light_coy
    name: 轻高机旅步兵连
    level: company
    children:
      - {template: pla_light_plt, count: 3}
      - {template: pla_light_fire_plt, count: 1}
      - {template: pla_light_coy_hq, count: 1}
    expected_personnel: 124
    expected_equipment: {light_armored_vehicle: 13, truck_medium: 1}
    notes: 全连 14 辆猛士（其中 1 辆卡车）；连直属 39 人。

  # ---- 摩步连 ----
  - id: pla_motor_coy_hq
    level: squad
    role: hq
    personnel: {officer: 2, political_officer: 1, vehicle_driver: 1, staff: 1, signaler: 1}
    slots: {truck_medium: 1, utility_vehicle: 1}
    confidence: estimated
    notes: 比轻型连少 1 名驾驶员；应有卡车和勤务吉普。
  - id: pla_motor_sniper_sq
    level: squad
    personnel: {squad_leader: 1, sniper: 6, spotter: 2}
    slots: {sniper_rifle: 3, sniper_gl: 3}
    confidence: estimated
    notes: 3 挺 QBU-202 + 3 具 11 式狙击榴弹发射器；“每班 1 名班长和两个火力组”。
  - id: pla_motor_hmg_sq
    level: squad
    personnel: {squad_leader: 1, mg_gunner: 2, assistant_gunner: 6}
    slots: {hmg: 2}
    confidence: estimated
  - id: pla_motor_agl_sq
    level: squad
    personnel: {squad_leader: 1, mg_gunner: 3, assistant_gunner: 5}
    slots: {agl: 3}
    confidence: estimated
    notes: 3 具三脚架模式 87 式（20kg）。
  - id: pla_motor_mortar_sq
    level: squad
    personnel: {squad_leader: 1, mortarman: 8}
    slots: {mortar_light: 2}
    confidence: estimated
  - id: pla_motor_fire_plt
    level: platoon
    children:
      - {template: pla_motor_sniper_sq, count: 1}
      - {template: pla_motor_hmg_sq, count: 1}
      - {template: pla_motor_agl_sq, count: 1}
      - {template: pla_motor_mortar_sq, count: 1}
  - id: pla_motor_coy
    name: 摩步旅步兵连
    level: company
    children:
      - {template: pla_motor_plt, count: 3}
      - {template: pla_motor_fire_plt, count: 1}
      - {template: pla_motor_coy_hq, count: 1}
    expected_personnel: 129

  # ==================================================================
  # 合成营 · 火力连
  # ==================================================================
  - id: pla_sp_mortar_sq
    name: 自行迫榴炮班（4 人车组）
    level: squad
    personnel: {vehicle_commander: 1, vehicle_driver: 1, artilleryman: 2}
    slots: {sp_mortar_howitzer: 1}
    notes: 排长兼任其中一辆车车长和班长。
  - {id: pla_sp_mortar_plt, level: platoon, children: [{template: pla_sp_mortar_sq, count: 3}]}

  - id: pla_at_sq_apc
    name: 反坦克班（乘 89 装输）
    level: squad
    personnel: {vehicle_commander: 1, vehicle_driver: 1, squad_leader: 1, team_leader: 1, assistant_gunner: 6}
    slots: {apc: 1, atgm_portable: 2}
    notes: 车长 + 驾驶员 2 人车组，2 个反坦克导弹组，班长和副班长各领导一个组，副射手共 6 名；装红箭-12 或红箭-73D。排长乘其中一车空位（89 装输可坐 13 人）。
  - id: pla_at_sq_hj8_vehicle
    name: 反坦克班（89 底盘红箭-8 导弹车）
    level: squad
    personnel: {vehicle_commander: 1, vehicle_driver: 1, vehicle_gunner: 1}
    slots: {atgm_vehicle: 1}
    confidence: estimated
    notes: 部分单位每班装备 1 部 89 式底盘红箭-8 反坦克导弹车；乘员数原文未给。
  - id: pla_at_plt_heavy
    name: 重型旅合成营反坦克排
    level: platoon
    children: [{template: pla_at_sq_apc, count: 3}, {template: pla_plt_officer_only, count: 1}]
    notes: 班数由营级对比“3 个反坦克导弹班”得出。
  - id: pla_at_plt_heavy_hj8
    variant_of: pla_at_plt_heavy
    level: platoon
    children: [{template: pla_at_sq_hj8_vehicle, count: 3}, {template: pla_plt_officer_only, count: 1}]
  - {id: pla_plt_officer_only, level: squad, role: hq, personnel: {officer: 1}}

  - id: pla_manpads_sq
    level: squad
    personnel: {manpads_gunner: 2, assistant_gunner: 4}
    slots: {manpads: 2}
    notes: 每班 2 具便导、每具 3 人；前卫-2（6km/4km/18kg）或红缨-6（6km/3.5km/16kg）。
  - id: pla_manpads_plt
    level: platoon
    children: [{template: pla_manpads_sq, count: 3}]
    expected_personnel: 18
    notes: 战时还可得到旅防空营便导连一个排加强。
  - id: pla_spaag_sq
    level: squad
    personnel: {vehicle_commander: 1, vehicle_driver: 1, ad_crew: 1}
    slots: {spaag: 1}
    confidence: estimated
  - id: pla_spaag_plt_bn
    name: 合成营 PGL-625 防空排（“土豪”单位）
    level: platoon
    children: [{template: pla_spaag_sq, count: 3}]
    notes: 3 辆 08 底盘 PGL-625，近两年因无人机威胁新增。

  - id: pla_fire_coy_cmd_spt_plt
    name: 火力连指挥保障排
    level: platoon
    children:
      - {template: pla_fire_coy_radar_sq, count: 1}
      - {template: pla_fire_coy_obs_sq, count: 1}
      - {template: pla_fire_coy_comm_sq, count: 1}
      - {template: pla_fire_coy_supply_sq, count: 1}
      - {template: pla_fire_coy_plt_hq, count: 1}
    expected_personnel: 28
  - {id: pla_fire_coy_radar_sq, level: squad, personnel: {radar_operator: 4}, slots: {radar_counter_battery: 1}, notes: 一代猛士底盘有源相控阵炮兵雷达。}
  - {id: pla_fire_coy_obs_sq, level: squad, personnel: {forward_observer: 5}, slots: {eo_recon_suite: 1}, notes: 89 底盘前沿观察车。}
  - {id: pla_fire_coy_comm_sq, level: squad, personnel: {signaler: 5}, slots: {apc: 1}}
  - {id: pla_fire_coy_supply_sq, level: squad, personnel: {supply: 9}, slots: {truck_medium: 3}}
  - {id: pla_fire_coy_plt_hq, level: squad, role: hq, personnel: {officer: 1, staff: 4}, slots: {armored_command_vehicle: 1}, notes: 89 底盘炮兵指挥车。}

  - id: pla_fire_coy_hq
    level: squad
    role: hq
    personnel: {vehicle_commander: 1, vehicle_driver: 1, officer: 2, political_officer: 1, staff: 1, signaler: 1, medic: 1}
    slots: {apc: 1}

  - id: pla_heavy_fire_coy
    name: 重型旅合成营火力连
    level: company
    children:
      - {template: pla_sp_mortar_plt, count: 2}
      - {template: pla_at_plt_heavy, count: 1}
      - {template: pla_manpads_plt, count: 1}
      - {template: pla_fire_coy_cmd_spt_plt, count: 1}
      - {template: pla_fire_coy_hq, count: 1}
    expected_personnel: 89
    notes: 自行迫榴炮 2-3 个排（6-9 门 PLD-10）。是否已增加无人机装备不确定。按原文各排人数逐项相加为 109 人，与原文总数 89 不符（反坦克班“副射手共 6 名”按每班理解）。

  - id: pla_light_fire_coy
    name: 轻高机旅合成营火力连
    level: company
    children:
      - {template: pla_light_mortar_plt, count: 2}
      - {template: pla_at_plt_light, count: 1}
      - {template: pla_manpads_plt, count: 1}
      - {template: pla_bn_sniper_sq, count: 1}
      - {template: pla_fire_coy_cmd_spt_plt, count: 1}
      - {template: pla_fire_coy_hq, count: 1}
    notes: 防空排只有便导；狙击班在火力连。
  - id: pla_light_mortar_sq
    level: squad
    personnel: {squad_leader: 1, vehicle_driver: 1, mortarman: 4}
    slots: {mortar_medium: 1, light_armored_vehicle: 1}
    confidence: estimated
    notes: >
      迫击炮型号多样：一代猛士 PCP-001 82mm 速射迫（同车另配 87 式 82 迫）、未列装的 CTL-181 半自动 120 车载迫、
      大部分单位为放在车上的步兵迫击炮 PP-89 100mm 或 PBP-172 120mm。槽位写 mortar_medium，可换 mortar_heavy / mortar_vehicle。
  - {id: pla_light_mortar_plt, level: platoon, children: [{template: pla_light_mortar_sq, count: 3}], confidence: estimated}
  - id: pla_at_sq_portable
    level: squad
    personnel: {squad_leader: 1, at_gunner: 2, assistant_gunner: 2, vehicle_driver: 1}
    slots: {atgm_portable: 2, light_armored_vehicle: 1}
    confidence: estimated
    notes: 除重型旅外各合成营反坦克排以单兵反坦克导弹为主。
  - {id: pla_at_plt_light, level: platoon, children: [{template: pla_at_sq_portable, count: 3}, {template: pla_plt_officer_only, count: 1}], confidence: estimated}
  - id: pla_bn_sniper_sq
    name: 营狙击班
    level: squad
    personnel: {squad_leader: 1, sniper: 6, spotter: 3}
    slots: {sniper_gl: 3, anti_materiel_rifle: 3, atv: 2}
    notes: 3 个小组，每组 1 名狙击榴弹发射器射手、1 名 10 式反器材步枪射手、1 名观察员；全班乘 2 辆山猫。

  - id: pla_motor_fire_coy
    name: 摩步旅合成营火力连
    level: company
    children:
      - {template: pla_motor_mortar82_plt, count: 2}
      - {template: pla_at_plt_light, count: 1}
      - {template: pla_bn_sniper_plt, count: 1}
      - {template: pla_motor_bn_fire_plt, count: 1}
      - {template: pla_fire_coy_hq, count: 1}
    expected_personnel: 145
    confidence: estimated
    notes: 无防空排。
  - {id: pla_mortar82_sq, level: squad, personnel: {squad_leader: 1, mortarman: 4}, slots: {mortar_medium: 1}, confidence: estimated, notes: 87 式 82mm，39.7kg。}
  - {id: pla_motor_mortar82_plt, level: platoon, children: [{template: pla_mortar82_sq, count: 3}], confidence: estimated}
  - {id: pla_bn_sniper_plt, level: platoon, children: [{template: pla_bn_sniper_sq, count: 3}], confidence: estimated, notes: 摩步旅多在复杂地形、城市和拉锯战，狙击班扩为狙击排。}
  - id: pla_motor_bn_fire_plt
    level: platoon
