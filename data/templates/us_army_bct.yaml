# 美国陆军 BCT 编制模板（原文 1.3.1–1.3.4；以 2021 年前后编制表为准）
#
# 字段速查（详见 data/README.md）：
#   level: squad | platoon | company | battalion | brigade
#   personnel / slots / slots_unassigned：{id: 数量}
#   children / attached：[{template, count}]
#   role: hq | support | equipment_pool（只放排/连共用装备、不占人员的伪班）
#   granularity: aggregate —— 原文只给到该级总数，内部未细分
#   expected_personnel / expected_equipment —— 原文给出的总数，供校验
#   confidence: estimated —— 为凑齐原文总数而推算的细节

templates:

  # ==================================================================
  # 通用：加强到下级的人员（来自营医护排、旅炮兵营火力支援单元）
  # ==================================================================
  - {id: us_att_medic, level: squad, role: support, personnel: {medic: 1}}
  - {id: us_att_fo,    level: squad, role: support, personnel: {forward_observer: 1}}
  - {id: us_att_fso,   level: squad, role: support, personnel: {forward_observer: 1}, notes: 连火援官（FSO），来自炮兵营。}

  # ==================================================================
  # ABCT · 班
  # ==================================================================
  - id: us_tank_crew
    name: M1 坦克车组
    level: squad
    personnel: {tank_commander: 1, tank_gunner: 1, tank_driver: 1, tank_loader: 1}
    slots: {mbt: 1}

  - id: us_rifle_squad
    name: 美陆军 9 人下车步兵班（ABCT/SBCT/IBCT 通用）
    level: squad
    personnel: {squad_leader: 1, team_leader: 2, automatic_rifleman: 2, grenadier: 2, marksman: 1, rifleman: 1}
    slots: {rifle: 7, lmg: 2, underbarrel_gl: 2, dmr: 1, uav_micro: 1, tactical_terminal: 1}
    notes: >
      班长 + 2 个火力组，每组 1 名 M249 机枪手、1 名 M320 榴弹手。一个火力组有精确射手（M110 SDMR，
      并未普遍编制）；另一组有 1 人受过反坦克导弹训练。2022 年起每班 1 架 RQ-28。班组普及 ATAK。
      单兵负重要求 53kg。

  - id: us_abct_rifle_squad
    variant_of: us_rifle_squad
    level: squad
    personnel: {squad_leader: 1, team_leader: 2, automatic_rifleman: 2, grenadier: 2, marksman: 1, rifleman: 1}
    slots: {rifle: 7, lmg: 2, underbarrel_gl: 2, dmr: 1, uav_micro: 1, tactical_terminal: 1}
    notes: 分散乘坐排内 4 辆 M2（拼车），不带车。

  - id: us_bradley_crew
    name: M2 步战车车组（3 人）
    level: squad
    personnel: {vehicle_commander: 1, vehicle_gunner: 1, vehicle_driver: 1}
    slots: {ifv: 1}

  - id: us_bradley_crew_led
    name: M2 车组（车长由排长/排军士担任）
    level: squad
    personnel: {vehicle_gunner: 1, vehicle_driver: 1}
    slots: {ifv: 1}

  - id: us_abct_mech_plt_hq
    name: ABCT 机步排排部
    level: squad
    role: hq
    personnel: {officer: 1, nco_senior: 1, vehicle_gunner: 1}
    slots_unassigned: {atgm_portable: 2}
    notes: 排长行车时任一车车长，下车时由炮长替代、候补车组乘员补位；排军士不下车，指挥 4 车。每排 2 具标枪不占编制，每具备弹 2-3 枚。

  - id: us_abct_tank_coy_hq_sec
    name: ABCT 装甲连连部（除坦克外）
    level: squad
    role: hq
    personnel: {nco_senior: 1, vehicle_driver: 1, supply: 2, signaler: 2}
    slots: {apc: 1, truck_medium: 1, light_armored_vehicle: 2}
    notes: 一级军士长乘 M113A3（不到 1/10 换 AMPV），负责军纪士气人事（类似指导员）；2 名补给员 LMTV（原拖 1.5 吨淡水挂车，现改车内装载）；2 辆装甲悍马/JLTV，一辆兼连长勤务车，一辆乘通信士官和无线电员。

  - id: us_abct_mech_coy_hq_sec
    name: ABCT 机步连连部（除步战车外）
    level: squad
    role: hq
    personnel: {nco_senior: 1, vehicle_driver: 1, supply: 2, signaler: 2}
    slots: {apc: 1, truck_medium: 1, light_armored_vehicle: 1, trailer: 1, uav_hand_launched: 1}
    slots_unassigned: {shotgun: 18}
    notes: 补给车上 18 支 M500 霰弹枪不占编制；通信悍马牵引 M1082 挂车；连级普遍配 RQ-11。

  # ==================================================================
  # ABCT · 排 / 连
  # ==================================================================
  - id: us_tank_plt
    name: M1 坦克排
    level: platoon
    children: [{template: us_tank_crew, count: 4}]
    expected_personnel: 16

  - id: us_abct_mech_plt
    name: ABCT 机械化步兵排
    level: platoon
    children:
      - {template: us_abct_rifle_squad, count: 3}
      - {template: us_bradley_crew, count: 2}
      - {template: us_bradley_crew_led, count: 2}
      - {template: us_abct_mech_plt_hq, count: 1}
    attached: [{template: us_att_medic, count: 1}, {template: us_att_fo, count: 1}]
    expected_personnel: 40
    expected_equipment: {ifv: 4}
    notes: 战时加强的医护兵和前观员按编制表没有座位，实践中因不满编一般有空座。

  - id: us_abct_tank_coy
    name: ABCT 装甲连
    level: company
    children:
      - {template: us_tank_plt, count: 3}
      - {template: us_tank_crew, count: 2}        # 连长、副连长车
      - {template: us_abct_tank_coy_hq_sec, count: 1}
    expected_personnel: 62
    expected_equipment: {mbt: 14}

  - id: us_abct_mech_coy
    name: ABCT 机械化步兵连
    level: company
    children:
      - {template: us_abct_mech_plt, count: 3}
      - {template: us_bradley_crew, count: 2}     # 连长、副连长车
      - {template: us_abct_mech_coy_hq_sec, count: 1}
    attached: [{template: us_att_fso, count: 1}]
    expected_personnel: 132
    expected_equipment: {ifv: 14}
    notes: 原文“共 132 人（不含加强部分为 126 人），连部 12 人”，两数自相矛盾。

  # ==================================================================
  # ABCT · 联兵营营部连
  # ==================================================================
  - id: us_m1064_squad
    name: M1064 车载 120 迫击炮班
    level: squad
    personnel: {squad_leader: 1, vehicle_driver: 1, mortarman: 3}
    slots: {mortar_vehicle: 1}
    confidence: estimated
    notes: 原文只给迫击炮排 23 人 / 4 车，每车 5 人参照 SBCT。

  - id: us_mortar_plt_hq
    level: squad
    role: hq
    personnel: {officer: 1, nco_senior: 1, forward_observer: 1}
    confidence: estimated

  - id: us_abct_bn_scout_brad_sq
    name: 营侦察排 M2A3 侦察班
    level: squad
    personnel: {vehicle_commander: 1, vehicle_gunner: 1, vehicle_driver: 1, scout: 3}
    slots: {recon_ifv: 1, eo_recon_suite: 1, uav_micro: 1}

  - id: us_abct_bn_scout_jltv_sq
    name: 营侦察排 JLTV 侦察班
    level: squad
    personnel: {vehicle_driver: 1, vehicle_gunner: 1, scout: 2}
    slots: {light_armored_vehicle: 1, hmg: 1, eo_recon_suite: 1}
    notes: JLTV 一般装 M2 机枪或 Mk19 榴弹发射器（此处槽位写 hmg，可替换为 agl）。

  - id: us_abct_bn_scout_plt_hq
    level: squad
    role: hq
    personnel: {officer: 1, nco_senior: 1, vehicle_driver: 2, scout: 2}
    slots: {light_armored_vehicle: 2, eo_recon_suite: 2, uav_hand_launched: 1, uav_micro: 2}
    slots_unassigned: {atgm_portable: 2}
    notes: 排部 2 台 JLTV；全排 1 台 RQ-20、5 台 RQ-28，实现每车有无人机。

  - id: us_abct_bn_scout_plt
    name: ABCT 营侦察排（轻重混编）
    level: platoon
    children:
      - {template: us_abct_bn_scout_brad_sq, count: 3}
      - {template: us_abct_bn_scout_jltv_sq, count: 3}
      - {template: us_abct_bn_scout_plt_hq, count: 1}
    expected_personnel: 36

  - id: us_bn_sniper_sq_3team
    name: 营狙击班（3 组）
    level: squad
    personnel: {squad_leader: 1, sniper: 6, spotter: 3}
    slots: {anti_materiel_rifle: 3, sniper_rifle: 3}
    notes: 每组 M82 + M24 各一名狙击手和一名观察员。

  - id: us_bn_staff_cell
    name: 营指挥部（情报、作战、火援、协调官、空军战术空中管制组）
    level: squad
    role: hq
    granularity: aggregate
    personnel: {staff: 36}
    notes: 含空军派驻的 TACP，负责对地支援计划和引导；人数细分原文未给。

  - id: us_abct_bn_medical_plt
    name: 营医护排
    level: squad
    role: support
    granularity: aggregate
    personnel: {medic: 32}
    slots: {armored_ambulance: 4}
    notes: 医疗班、战场救护班（4 辆 M113/AMPV 救护车，每车 1 驾驶 2 救护）、前线医护班（每个机步连 4 人小组，高级医护兵在连部，3 人下到排）。

  - id: us_abct_bn_hq_log
    name: 营后勤部（补给、人事、通信、管理）
    level: squad
    role: support
    granularity: aggregate
    personnel: {staff: 27}
    slots: {apc: 16, light_armored_vehicle: 14, truck_medium: 6, truck_heavy: 1, trailer: 6}
    confidence: estimated
    notes: 营部车辆总数（20 AMPV/M113、19 JLTV、4 LMTV、2 MTV、1 HEMTT、6 挂车）扣除已分配到各排后放在这里。

  - {id: us_comm_relay_team, level: squad, role: support, personnel: {signaler: 3}}
  - {id: us_abct_mine_clear_team, level: squad, role: support, personnel: {engineer: 2}, slots: {mine_clearing_vehicle: 2}}

  - id: us_abct_cab_hhc
    name: ABCT 联兵营营部连
    level: company
    role: hq
    children:
      - {template: us_m1064_squad, count: 4}
      - {template: us_mortar_plt_hq, count: 1}
      - {template: us_abct_bn_scout_plt, count: 1}
      - {template: us_bn_sniper_sq_3team, count: 1}
      - {template: us_bn_staff_cell, count: 1}
      - {template: us_abct_bn_medical_plt, count: 1}
      - {template: us_abct_bn_hq_log, count: 1}
      - {template: us_comm_relay_team, count: 1}
      - {template: us_abct_mine_clear_team, count: 1}
      - {template: us_tank_crew, count: 1}         # 营长坦克
    expected_personnel: 181
    expected_equipment: {mbt: 1, mortar_vehicle: 4, light_armored_vehicle: 19, truck_medium: 6, truck_heavy: 1}
    notes: 另有加强自炮兵营的 7 人火力支援排和 24 人火力支援单元（分配前观小组、连 FIST、排火援官）。

  - id: us_fa_fire_support_elem
    name: 火力支援排 + 火力支援单元（加强到联兵营）
    level: squad
    role: support
    personnel: {forward_observer: 31}

  # ==================================================================
  # ABCT · 联兵营
  # ==================================================================
  - id: us_abct_armor_bn
    name: ABCT 装甲联兵营（2 坦 1 步）
    level: battalion
    children:
      - {template: us_abct_tank_coy, count: 2}
      - {template: us_abct_mech_coy, count: 1}
      - {template: us_abct_cab_hhc, count: 1}
    attached: [{template: us_fa_fire_support_elem, count: 1}, {template: us_abct_fsc_cab, count: 1}]
    default_bindings: {mbt: m1a2_sepv2, ifv: m2a3, recon_ifv: m2a3_scout, apc: m113a3, light_armored_vehicle: jltv, mortar_vehicle: m1064, truck_medium: lmtv, truck_heavy: hemtt, rifle: m4a1, lmg: m249, underbarrel_gl: m320, dmr: m110_sdmr, atgm_portable: javelin, uav_micro: rq28_skydio_x2, uav_hand_launched: rq20}
    expected_personnel: 431

  - id: us_abct_inf_bn
    name: ABCT 步兵联兵营（2 步 1 坦）
    level: battalion
    children:
      - {template: us_abct_mech_coy, count: 2}
      - {template: us_abct_tank_coy, count: 1}
      - {template: us_abct_cab_hhc, count: 1}
    attached: [{template: us_fa_fire_support_elem, count: 1}, {template: us_abct_fsc_cab, count: 1}]
    expected_personnel: 495

  # ==================================================================
  # ABCT · 骑兵营
  # ==================================================================
  - id: us_abct_cav_scout_sq
    name: ABCT 骑兵连侦察班（M3）
    level: squad
    personnel: {vehicle_commander: 1, vehicle_gunner: 1, vehicle_driver: 1, scout: 3}
    slots: {recon_ifv: 1, eo_recon_suite: 1, gpmg: 1, underbarrel_gl: 1, rifle: 3}

  - id: us_abct_cav_scout_pool
    level: squad
    role: equipment_pool
    slots: {atgm_portable: 2, ugv_small: 3, uav_hand_launched: 1, uav_micro: 5}
    notes: 排共用：2 具标枪、3 台遥控机器车、1 台 RQ-11、5 台 RQ-28。

  - id: us_abct_cav_scout_plt
    name: ABCT 骑兵连侦察排（6 车）
    level: platoon
    children: [{template: us_abct_cav_scout_sq, count: 6}, {template: us_abct_cav_scout_pool, count: 1}]
    expected_personnel: 36
    notes: 排部 2 车 + 4 个班各 1 车；排长、排军士任车长（未单列）。

  - id: us_cav_troop_hq_m3
    level: squad
    role: hq
    personnel: {officer: 1, vehicle_gunner: 1, vehicle_driver: 1}
    slots: {recon_ifv: 1, uav_hand_launched: 1}
    confidence: estimated
    notes: 连部 1 辆 M3 + 1 台 RQ-20；连部其余人员原文未给。

  - id: us_abct_cav_troop
    name: ABCT 骑兵连
    level: company
    children:
      - {template: us_abct_cav_scout_plt, count: 2}
      - {template: us_m1064_squad, count: 2}
      - {template: us_cav_troop_hq_m3, count: 1}
    expected_equipment: {recon_ifv: 13, mortar_vehicle: 2}

  - id: us_abct_cav_hht
    name: ABCT 骑兵营营部连
    level: company
    role: hq
    children: [{template: us_abct_cav_hht_agg, count: 1}]
    notes: 原文未展开营部连；人数按骑兵营 398 人倒推。
  - {id: us_abct_cav_hht_agg, level: squad, role: hq, granularity: aggregate, personnel: {staff: 81}, confidence: estimated}

  - id: us_abct_cav_sqn
    name: ABCT 骑兵营（中队）
    level: battalion
    children:
      - {template: us_abct_cav_troop, count: 3}
      - {template: us_abct_tank_coy, count: 1}
      - {template: us_abct_cav_hht, count: 1}
    attached: [{template: us_abct_fsc_cav, count: 1}]
    expected_personnel: 398
    notes: 火力更强、下车步兵更少、更快、感知更强的步兵营；任务是火力侦察。

  # ==================================================================
  # ABCT · 炮兵营
  # ==================================================================
  - id: us_m109_section
    name: M109 炮班（含弹药车、HEMTT）
    level: squad
    personnel: {squad_leader: 1, artilleryman: 12, driver: 2}
    slots: {howitzer_heavy_sp: 1, ammo_carrier_tracked: 1, truck_heavy: 1}
    confidence: estimated
    notes: 炮连 90 人 / 6 门，按每门 15 人平摊。

  - id: us_abct_fa_battery
    name: M109 炮连
    level: company
    children: [{template: us_m109_section, count: 6}]
    expected_personnel: 90

  - id: us_fa_target_acq_plt
    name: 炮兵营目标获取排
    level: squad
    role: support
    slots: {radar_counter_battery: 6, light_armored_vehicle: 5, trailer: 1}
    notes: 4 部 TPQ-50（10km）+ 1 部 TPQ-36（24km）+ 1 部 TPQ-37（50km）；前两者装在悍马单排皮卡上，后者装拖车。

  - {id: us_sq_generic, level: squad, granularity: aggregate, notes: 原文只给出班/组名称，人员和装备未给。}
  - {id: us_fa_comm_plt, name: 炮兵营通信排, level: platoon, children: [{template: us_sq_generic, count: 1}]}
  - {id: us_fa_medical_plt, name: 炮兵营医疗排, level: platoon, children: [{template: us_sq_generic, count: 1}]}
  - {id: us_fa_survey_sec, name: 测量分队, level: squad, granularity: aggregate}
  - {id: us_fa_counterfire_cell, name: 反炮兵计划组, level: squad, granularity: aggregate}
  - id: us_abct_fa_hhb
    name: 炮兵营营部连
    level: company
    role: hq
    children:
      - {template: us_fa_comm_plt, count: 1}
      - {template: us_fa_medical_plt, count: 1}
      - {template: us_fa_target_acq_plt, count: 1}
      - {template: us_fa_survey_sec, count: 1}
      - {template: us_fa_counterfire_cell, count: 1}
    notes: 原文“除了通讯排和医疗排外，有一个通信排和一个目标获取排”，另有测量分队和反炮兵计划组。人数原文未给（营 503 − 3×90 = 233，可能含加强到各营的火力支援人员）。
  - id: us_ibct_fa_hhb
    variant_of: us_abct_fa_hhb
    level: company
    role: hq
    children:
      - {template: us_fa_comm_plt, count: 1}
      - {template: us_fa_medical_plt, count: 1}
      - {template: us_fa_target_acq_plt_light, count: 1}
      - {template: us_fa_survey_sec, count: 1}
      - {template: us_fa_counterfire_cell, count: 1}
    notes: 目标获取排少一部 TPQ-37。

  - id: us_abct_fa_bn
    name: ABCT 炮兵营
    level: battalion
    children: [{template: us_abct_fa_battery, count: 3}, {template: us_abct_fa_hhb, count: 1}]
    attached: [{template: us_abct_fsc_fa, count: 1}]
    default_bindings: {howitzer_heavy_sp: m109a6, ammo_carrier_tracked: m109_ammo_carrier, truck_heavy: hemtt}
    expected_personnel: 503
    notes: 美军炮兵似乎以反炮兵为首要任务，火力支援更多由航空兵承担。

  # ==================================================================
  # ABCT · 工兵营
  # ==================================================================
  - {id: us_beb_cp_spt_sq, name: 指挥部支援班, level: squad, granularity: aggregate}
  - {id: us_beb_relay_team, name: 中继组, level: squad, granularity: aggregate}
  - {id: us_beb_node_sq, name: 网络节点班, level: squad, granularity: aggregate}
  - {id: us_beb_hq_net_plt, name: 总部和网络支持排, level: platoon, children: [{template: us_beb_cp_spt_sq, count: 1}, {template: us_beb_relay_team, count: 1}]}
  - {id: us_beb_net_ext_plt, name: 网络延伸排, level: platoon, children: [{template: us_beb_node_sq, count: 1}, {template: us_beb_relay_team, count: 1}]}
  - id: us_beb_signal_coy
    name: 信号连
    level: company
    role: support
    children: [{template: us_beb_hq_net_plt, count: 1}, {template: us_beb_net_ext_plt, count: 1}]
  - {id: us_beb_collection_plt, name: 信息收集排, level: platoon, children: [{template: us_sq_generic, count: 1}]}
  - {id: us_beb_ew_sec, name: 电子战分队, level: squad, granularity: aggregate}
  - {id: us_beb_multifunction_plt, name: 多功能排, level: platoon, children: [{template: us_sq_generic, count: 1}]}
  - {id: us_vsq_rq7, level: squad, granularity: aggregate, slots: {uav_tactical: 1}}
  - {id: us_beb_uav_plt, name: 无人机排, level: platoon, children: [{template: us_vsq_rq7, count: 4}], notes: 4 架弹射起飞的 RQ-7。}
  - {id: us_af_weather_team, name: 空军气象组, level: squad, granularity: aggregate}
  - id: us_beb_mi_coy
    name: 情报连
    level: company
    role: support
    children:
      - {template: us_beb_collection_plt, count: 1}
      - {template: us_beb_ew_sec, count: 1}
      - {template: us_beb_multifunction_plt, count: 1}
