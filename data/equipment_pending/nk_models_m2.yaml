# 纳卡战区：需要新增类别的型号（等待 01 迁移 M2：categories.yaml 新增 loitering_munition、tbm_launcher）
# 这个目录不在 tools/validate_data.py 的扫描范围内；M2 落地后整体移到 data/equipment/ 并删除本目录。
# 格式与 data/equipment/nk_models.yaml 相同；来源键见该文件头。

models:
  # ======================= 战术弹道导弹发射车（tbm_launcher）=======================
  - {id: scud_b, name: 9K72 Elbrus (Scud-B), category: tbm_launcher, family: scud, origin: RUS, crew: 4, service_year: 1964,
     specs: {range_km: 300, cep_m: 450}, src: wp_Scud,
     notes: 亚方 8 部发射车 / 32 枚（wp_arm_eq_2020）；纳卡防卫军另有至少 4 部（wp Artsakh Defence Army 2020-09 修订版 oldid=977867503）。Oryx 2020 记录亚方弹道导弹损失 2。}
  - {id: tochka_u, name: OTR-21 Tochka-U, category: tbm_launcher, family: tochka, origin: RUS, crew: 3, service_year: 1989,
     specs: {range_km: 120, cep_m: 95}, src: wp_OTR-21_Tochka, notes: 阿方约 3–4 部（2010 维基修订版称 2008 年阅兵见到 3 部）；亚方亦有少量（说法不一）。}
  - {id: iskander_e, name: 9K720 Iskander-E, category: tbm_launcher, family: iskander, origin: RUS, crew: 3, service_year: 2006,
     specs: {range_km: 280}, src: wp_9K720_Iskander, notes: 亚方 2016 年阅兵首次展示，4 部左右（wp_arm_eq_2020 记 4–8）。出口型射程 280km（MTCR）。}
  - {id: lora, name: IAI LORA, category: tbm_launcher, family: lora, origin: ISR, service_year: 2017,
     specs: {range_km: 400, cep_m: 10}, confidence: uncertain, src: wp_LORA_(missile),
     notes: 阿方引进数量不明（2020 维基列表“50 launchers”明显有误；2025 版记 4）。剧本取 4（uncertain）。}

  # ======================= 巡飞弹发射单元（loitering_munition）=======================
  - {id: harop, name: IAI Harop, category: loitering_munition, family: harpy, origin: ISR, service_year: 2009,
     specs: {range_km: 1000, endurance_h: 6, warhead_kg: 23}, src: wp_IAI_Harop,
     notes: 阿方 2016 年 4 月冲突首次实战使用；2020 年广泛使用（打击防空雷达、S-300 等）。数量不明。}
  - {id: skystriker, name: Elbit SkyStriker, category: loitering_munition, family: skystriker, origin: ISR, service_year: 2016,
     specs: {range_km: 100, endurance_h: 2, warhead_kg: 5}, src: wp_Elbit_SkyStriker, notes: 阿方 2019 年引进（约 100 枚的说法，uncertain）。}
  - {id: orbiter_1k, name: Orbiter-1K（阿方称 Zərbə）, category: loitering_munition, family: orbiter, origin: AZE, service_year: 2016,
     specs: {range_km: 100, endurance_h: 2.5, warhead_kg: 2}, confidence: uncertain, src: wp_Aeronautics_Orbiter,
     notes: Aeronautics 设计、Azad Systems 本地生产——阿方国内生产线的例子（11 §4.5.3）。}
  - {id: hresh, name: HRESH, category: loitering_munition, family: hresh, origin: ARM, service_year: 2020, confidence: uncertain, src: wp_arm_eq_2020,
     notes: 亚方国产巡飞弹，2020 年战争前后少量；性能资料极少。}
