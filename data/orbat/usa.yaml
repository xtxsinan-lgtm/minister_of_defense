      师炮兵 3 个营：加强装甲师 3 个自行 155 营；装甲师 2 自行 155 + 1 牵引 155；其他师 1 牵引 155 + 2 牵引 105（M1299 营已取消）。
      装甲增强师师属工兵旅 4 个营（每营 7 工兵连、5 架桥连、2 工事连、1 道路清障连）；其他师 1 个工兵营（5 个工兵连）。
      师新增保护旅：旅部、旅支援营、宪兵营、防化营、防空营（3 个 M-SHORAD 连各 12 车、1 个反无人机连、1 个曲射火力保护连）。
      M-SHORAD 需要增加到现在的 3 倍。

