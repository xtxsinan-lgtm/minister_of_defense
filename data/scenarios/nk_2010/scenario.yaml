# 剧本 nk_2010：十年备战（2010-01-01 开局）
# 规格：docs/spec/14_scenario_nk.md §3.1、§4。来源键见 nk_common/countries.yaml 文件头与 data/equipment/nk_models.yaml 文件头。
# 库存数字的 confidence 逐项标注；uncertain 的数字在 14 N-10 中列为“需用 IISS Military Balance 2010 核对”。

scenario:
  id: nk_2010
  name: 纳卡：十年备战（2010）
  theater: nk
  start: 2010-01-01T00:00:00Z
  suggested_horizon: 2020-12-31T23:59:00Z   # 沙盒无固定结束（总纲 §18.8）；挑战目标在此日期结算
  playable: [ARM, AZE]
  default_historical_mode: plausible        # 11 §4.12、S-14
  includes: [nk_common/countries.yaml, nk_common/theater.yaml, nk_common/logistics_nodes.yaml, nk_common/procurement.yaml,
             nk_common/events.yaml, nk_common/ai_profiles.yaml]
  difficulty_note: 亚美尼亚为主要挑战剧本（总纲 §21-4）；阿塞拜疆目标不同（goals）。

war_state_at_start: {wars: [], tension: {ARM-AZE: 0.45}}

