oob:
  ARM:
    inherit_from: nk_2010                   # 复用 nk_2010 的 oob.ARM，然后应用下列差异（14 §4.3 规则 O2）
    overrides:
      - {id: arm_nk_army, tier: active}
      - {id: arm_1st_corps, lat: 39.5111, lon: 46.3383, note: 支援拉钦—库巴德利方向}
      - {id: arm_army_troops, add_direct: [{template: arm_mrl_lr_bn, count: 1, binding: {mrl_long_range: 9a52_smerch}}, {template: arm_tbm_bn, count: 1, binding: {tbm_launcher: iskander_e}}],
         add_direct_note: 伊斯坎德尔营原写在 add_pending_m2，已并入 add_direct（DC-205）}
  AZE:
    inherit_from: nk_2010
    overrides:
      - {id: aze_4th_corps, tier: active, lat: 40.3744, lon: 47.1267, note: 2020 年前调至巴尔达方向（estimated）}
      - {id: aze_1st_corps, lat: 40.3417, lon: 46.9311}
      - {id: aze_2nd_corps, lat: 39.4481, lon: 47.3361}
      - {id: aze_3rd_corps, lat: 40.5000, lon: 46.4000, note: 穆罗夫山北麓（estimated）}
      - {id: aze_army_troops, add_direct: [{template: aze_mrl_lr_bn, count: 1, binding: {mrl_long_range: polonez}}, {template: aze_mrl_lr_bn, count: 1, binding: {mrl_long_range: lynx_mrl}},
                                           {template: aze_tbm_bn, count: 1, binding: {tbm_launcher: lora}},
                                           {template: aze_loitering_bn, count: 2, binding: {loitering_launcher: harop_launcher}}],
         note: 巡飞弹营 = 营级模板 aze_loitering_bn（原 4 个巡飞弹连 = 2 个营）；发射单元缺 harop_launcher 时由 01 同类替代（skystriker/orbiter_1k 发射单元）}

