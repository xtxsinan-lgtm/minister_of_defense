# 剧本 nk_2020：2020 年 9 月（直接开战）
# 规格：docs/spec/14_scenario_nk.md §3.1、§4、§9.2（V2 校准目标在 calibration.yaml）。
# 来源键：wp_arm_eq_2020（oldid=973047801）、wp_aze_eq_2020（oldid=977340066）、wp_nka_2020（oldid=977867503）、
#        wp Azerbaijani Air Forces 2020-09-18（oldid=979118097）、wp Armenian Air Force 2020-09-18（oldid=979120545）。
# 维基列表本身引用 IISS 等；2020 年阿方列表有明显错误条目（如 LORA “50 部”），这类数字不采用并注明。

scenario:
  id: nk_2020
  name: 纳卡：2020 年 9 月
  theater: nk
  start: 2020-09-27T00:00:00Z
  suggested_horizon: 2021-03-31T23:59:00Z
  playable: [ARM, AZE]
  default_historical_mode: historical
  includes: [nk_common/countries.yaml, nk_common/theater.yaml, nk_common/logistics_nodes.yaml, nk_common/procurement.yaml,
             nk_common/events.yaml, nk_common/ai_profiles.yaml, nk_common/presentation.yaml]
  control_snapshot: nk_loc_1994             # 10 ControlSnapshot（data/map/nk/control/nk_loc_1994.yaml），开局 TileControl（14 §4.2，DC-170）

presentation_overrides: {tutorial_file: data/tutorial/nk_2020.yaml}   # 14 §3.9

ai_profile_overrides: {AZE: {doctrine_id: western}}   # 12 I-02：2020 年阿方反映土耳其顾问影响（14 §3.11）

war_state_at_start:
  wars: []                                  # 战争由事件 aze_2020_september_offensive 在 03:00Z 创建（Historical）；玩家为阿方时由玩家决定
  tension: {ARM-AZE: 0.80}                  # 危机级（七月托武兹冲突之后）
  scripted_start:                           # 仅 historical 模式；玩家国家不受这些 AI 指令约束（11 §4.12）
    - {at: 2020-09-27T03:00:00Z, event: aze_2020_september_offensive}
    - {at: 2020-09-27T08:00:00Z, country: ARM, mobilization: full, note: 亚美尼亚与纳卡当日宣布戒严与总动员（Second Nagorno-Karabakh War 条目）}
    - {at: 2020-09-28T08:00:00Z, country: AZE, mobilization: partial, note: 阿方 9-28 宣布部分动员}
  completed_contracts_note: 开局前已交付的合同全部计入 inventory；在途合同见 open_contracts。

open_contracts:                             # 开局时已批准、未交付完的合同（11 ProcurementContract）
  ARM:
    - {seller: RUS, model: su30sm, qty: 8, delivered: 0, next_lot: 2021-06-01, note: wp Armenian Air Force 2020-09：“4 架在役、8 架在订”；交付期 uncertain}
  AZE: []

