# nk_2020 历史校准目标（V2；14 §9.2，11 §9.2）
# 每个目标给：史实值、来源、验收区间（band，bal：考虑来源不确定性与模型粒度）。
# 来源：
#   wp_war   = https://en.wikipedia.org/wiki/Second_Nagorno-Karabakh_War （信息框，访问 2026-10-16）
#   wp_tl    = https://en.wikipedia.org/wiki/Timeline_of_the_Second_Nagorno-Karabakh_War
#   wp_cf    = https://en.wikipedia.org/wiki/2020_Nagorno-Karabakh_ceasefire_agreement
#   oryx     = https://www.oryxspioenkop.com/2020/09/the-fight-for-nagorno-karabakh.html （视觉确认的装备损失，访问 2026-10-16；
#              只计有照片/视频的条目，是下限而非真值）

