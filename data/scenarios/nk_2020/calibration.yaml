    regions_captured: [fuzuli_district, jabrayil_district, zangilan_district, qubadli_district, "hadrut（nk_oblast 南部）", shusha]
    share_of_arm_core_tiles: {value_estimate: 0.35, band: [0.25, 0.50], confidence: estimated,
                              basis: "南四区 + 哈德鲁特 + 舒沙约占亚方战前控制面积的 1/3–2/5（按区面积粗估；以地块计数复核，14 §9.2）"}
