                dates: {aghdam: 2020-11-20, kalbajar: 2020-11-25, lachin: 2020-12-01}, source: wp_war 图例 / wp_cf}
  peacekeeping: {actor: RUS, troops: 1960, years: 5, regions: [lachin_corridor, nk_contact_line_arm_side], source: wp_cf}

timeline_milestones:                         # 阿方宣布控制的日期（wp_tl；阿方说法，部分亚方当时否认）
  - {date: 2020-10-03, event: 北线塔利什、苏古沃尚方向推进（阿方宣布控制塔利什）}
  - {date: 2020-10-04, event: 阿方宣布控制杰布拉伊尔城（亚方否认，约 10-09 确认）}
  - {date: 2020-10-09, event: 阿方宣布控制哈德鲁特（实际争夺持续至 10 月中旬）}
  - {date: 2020-10-17, event: 阿方宣布控制菲祖利城}
  - {date: 2020-10-20, event: 阿方宣布控制赞格兰城}
  - {date: 2020-10-25, event: 阿方宣布控制库巴德利城}
  - {date: 2020-11-08, event: 阿方宣布控制舒沙}
  - {date: 2020-11-09, event: 三方停火声明签署}
milestone_band: "模拟中南线（杰布拉伊尔/菲祖利/赞格兰/库巴德利）各城所在地块易手日期与史实相差 ≤ 15 天；舒沙地块易手（若发生）在第 30–50 天"

qualitative_checks:                          # 定性检查（人工 + AAR 统计）
  - id: drones_dominate_losses
    claim: 亚方重装备损失以无人机/巡飞弹与炮兵为主，直瞄交战占比小
    metric: "04 BattleLossLedger 中亚方装备损失归属 A（纵深打击）+ C（反炮兵与火力消耗）线的比例"
    band: [0.5, 0.9]
    confidence: uncertain
    basis: 多数公开分析的定性结论；无可靠量化统计
  - id: armenian_ad_attrited_early
    claim: 亚方防空在战争前两周被大量消耗
    metric: "第 14 天时亚方 sam_short + sam_medium + sam_long 永久损失 / 战争总损失"
    band: [0.5, 0.9]
    confidence: uncertain
  - id: no_red_line
    claim: 战事未越过俄罗斯 CSTO 红线（亚本土无地面入侵），俄未参战
    metric: "rus_csto_armenia_proper 未进入 forced_ceasefire 阶段"
    band: "≥ 90% 的种子满足"
