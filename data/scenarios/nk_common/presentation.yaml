# ------------------------------------------------------------------ 主要对手（13 顶栏 tensionWithMainRival；必须与 countries.yaml rival 一致）
main_rival: {ARM: AZE, AZE: ARM}

# ------------------------------------------------------------------ 引导与默认展示密度
tutorial_file: null                   # 各剧本用 presentation_overrides 指定 data/tutorial/<scenarioId>.yaml
default_disclosure: standard          # 13 DisclosureLevel（13 §3.1；U-18）
