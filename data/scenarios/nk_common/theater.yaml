# 纳卡战区地图范围、区域（地块集合）、控制锚点、关键地块、卫星资产
# 规格：docs/spec/14_scenario_nk.md §3.3、§4.1–4.2。地块 = H3 第 4 级（00 §3.5）。
# 本文件不写 H3 索引：10 的离线流水线按下面的规则把经纬度/多边形换成地块列表，输出到 data/map/nk/（10 定义格式）。
# 坐标：WGS84 度；取自各地名的英文维基百科信息框（访问 2026-10），误差 < 2 km，远小于地块尺度（对边约 40 km）。
#       confidence: estimated（未逐一与 OSM 核对；10 的流水线会用 OSM place 节点覆盖，见 14 N-06）。

theater:
  id: nk
  include_rule: "H3 r4 单元中心落在 ARM ∪ AZE 法理领土（Natural Earth admin-0 1:10m，含纳希切万与纳卡）内的单元"
  expected_tile_count: {estimate: 66, basis: "亚 29,743 km² + 阿 86,600 km²（含纳希切万）≈ 116,343 km² ÷ H3 r4 平均 1,770 km² ≈ 65.7；总纲 §21-4 写“约 65 格”"}
  outside_neighbors: [GEO, RUS, IRN, TUR]
  outside_rule: 战区外地块不实例化；与战区外相邻的交界边不可通行（不能移动、不触发战斗）；空中层不限（越界飞行由 08/11 事件处理，阶段 1 只记日志）。
  caspian: 里海不分格（海军阶段 3）；巴库港口岸阶段 1 视为陆地口岸的一种（06 §3.4 Sea 阶段 2+ → 本剧本按 Rail/Road 外部方式处理，见 logistics_nodes.yaml）。

# ------------------------------------------------------------------ 法理归属（11 TileClaimTable）
de_jure:
  rule: 按 Natural Earth admin-0：单元中心在阿塞拜疆境内（含纳卡、七区、纳希切万）→ AZE；在亚美尼亚境内 → ARM。
  note: 叙事中立（总纲 §21-4）：法理归属只用于红线判定与“本土”定义，界面只显示“控制方”。

# ------------------------------------------------------------------ 区域（地块集合引用；10 产出，11/12/14 使用）
# 区域多边形来源：GADM 4.1 阿塞拜疆二级行政区（rayon）https://gadm.org/download_country.html （AZE level 2）
#   rayon 名称按 GADM 拼写；GADM 不含 1991 年前的纳卡自治州（NKAO）边界，NKAO 用 rayon 并集近似（14 N-05）。
regions:
  armenia_proper:   {rule: "de_jure == ARM"}
  nakhchivan:       {gadm_l1: ["Nakhchivan"], note: GADM 中纳希切万为一级单位}
  nk_oblast:        {gadm_l2_union: ["Xankəndi", "Xocalı", "Şuşa", "Xocavənd", "Ağdərə"], confidence: uncertain,
                     note: 1991 年后阿方重划 rayon，Ağdərə/Xocavənd 部分属原 NKAO 以外；以地块精度可接受}
  aghdam_district:  {gadm_l2: "Ağdam"}
  fuzuli_district:  {gadm_l2: "Füzuli"}
  jabrayil_district: {gadm_l2: "Cəbrayıl"}
  zangilan_district: {gadm_l2: "Zəngilan"}
  qubadli_district: {gadm_l2: "Qubadlı"}
  lachin_district:  {gadm_l2: "Laçın"}
  kalbajar_district: {gadm_l2: "Kəlbəcər"}
  seven_districts:  {union: [aghdam_district, fuzuli_district, jabrayil_district, zangilan_district, qubadli_district, lachin_district, kalbajar_district]}
  conflict_zone:    {union: [nk_oblast, seven_districts]}
  aze_proper_outside_conflict_zone: {rule: "de_jure == AZE && !conflict_zone && !nakhchivan"}
  lachin_corridor:  {rule: "地块与 Goris(39.511,46.338)→Lachin(39.643,46.547)→Stepanakert(39.815,46.752) 折线相交", note: 2020 停火声明的 5 km 宽走廊在地块精度下即沿线 2–3 格}
  araz_border_strip: {rule: "de_jure == AZE && 地块与伊朗边界（阿拉斯河）相邻"}
  nk_contact_line_arm_side: {rule: "停火时计算：ARM 控制且与 AZE 控制地块相邻的 nk_oblast 地块（14 §4.7.2）"}

