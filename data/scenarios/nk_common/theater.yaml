# ------------------------------------------------------------------ 卫星资产（05 SatelliteAsset）
# revisit / quality 为 bal/estimated；过顶相位 pass_phase_h 由 14 §4.2 用 worldSeed 确定性生成（Scenario 域 salt 3）。
satellites:
  - {id: azersky, owner: AZE, means: optical_satellite, revisit_h: 24, quality: 0.6, from: 2014-07-01,
     shares_with: [], note: 2014 年阿方购入 SPOT-7 并更名 Azersky（公开报道），estimated}
  - {id: tur_gokturk2, owner: TUR, means: optical_satellite, revisit_h: 24, quality: 0.5, from: 2012-12-18,
     shares_with: [AZE], shares_requires: "external_actors.TUR.intel_sharing 开启（R-12）", note: estimated}
