# ------------------------------------------------------------------ 战略方向预设（06 StrategicDirection；14 §4.5 第 3 步）
# 国家级运力（rail_fleet_payload_t、national_truck_payload_t）已移到 countries.yaml（14 §3.10）。
# anchors = theater.yaml 的 key_tiles / control_anchors 名；方向的 Region = 各锚点所在地块的 10 RegionOf（先列的方向优先占用）。
# 权重 bal；未覆盖的 Region 归 06 的“其他”方向。
country_logistics:
  ARM:
    strategic_direction_preset:
      east_nk:         {weight: 0.60, anchors: [stepanakert, shusha, martakert, hadrut, lachin, goris]}
      south_meghri:    {weight: 0.15, anchors: [zangilan]}
      west_nakhchivan: {weight: 0.15, anchors: [yerevan]}
      north_tavush:    {weight: 0.10, anchors: [berd]}
  AZE:
    strategic_direction_preset:
      west_nk:         {weight: 0.75, anchors: [tartar, barda, beylagan, horadiz, ganja]}
      nakhchivan:      {weight: 0.15, anchors: [nakhchivan_city]}
      north_tovuz:     {weight: 0.10, anchors: [tovuz]}

