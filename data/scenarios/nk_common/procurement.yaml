#   confidence 一律 estimated 或 uncertain，basis 写明推算方法。V4 搜索（14 §9.3）会对单价做 ±50% 敏感性扫描，
#   结论若对单价敏感，必须先用 SIPRI 趋势指示值（TIV，https://www.sipri.org/databases/armstransfers）校准。
