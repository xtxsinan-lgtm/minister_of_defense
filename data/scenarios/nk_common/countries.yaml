    playable: true
    rival: AZE
    note_g13: 纳卡“防卫军”作为 ARM 一方的编组（00 G-13 / 14 N-01 / DC-002 已同意），人员、装备、预算并入 ARM；不单设国家。
    capital_key_tile: yerevan                # theater.yaml key_tiles（12 §4.1.3“首都”）
    gdp_musd_by_year:        {2010: 10887, 2011: 11683, 2012: 12009, 2013: 12366, 2014: 12688, 2015: 11428, 2016: 11312, 2017: 12147, 2018: 12834, 2019: 13802, 2020: 12642}   # wb_gdp → 2020$
    population_m_by_year:    {2010: 3.045, 2011: 3.028, 2012: 3.024, 2013: 3.022, 2014: 3.014, 2015: 3.005, 2016: 2.992, 2017: 2.979, 2018: 2.969, 2019: 2.963, 2020: 2.962}   # wb_pop
    base_budget_musd_by_year: {2010: 464.4, 2011: 450.2, 2012: 430.4, 2013: 494.3, 2014: 500.3, 2015: 484.4, 2016: 462.7, 2017: 467.5, 2018: 528.7, 2019: 660.8, 2020: 634.0}   # wb_milex → 2020$
    budget_note: SIPRI 口径不含纳卡自身的防务开支（未公开）；是否加一项 nk_supplement 见 14 N-04（默认 0）。
    budget_confidence: stated
    conscription:
      conscription: true
      term_months: 24                       # wp_arm_2020 信息框
      annual_intake_cap: 16000              # estimated：18 岁男性约 3.1 万/年（wp_arm_2020 reaching_military_age 31,774），扣除免役/延期约一半
      contract_share_target: {2010: 0.25, 2020: 0.45}   # estimated：2017 年约 1.9 万义务兵 + 2.3 万职业军人（wp_arm_2020）
      reserve_pool: 210000                  # wp_arm_2020：“近 15 年服过役的前军人 21 万”
      reserve_general_skill: 0.30           # estimated / bal
      pay_musd_per_head_year: {conscript: 0.0015, contract: 0.006, officer: 0.012, reservist_mobilized: 0.003, civilian: 0.005}
      pay_confidence: estimated
      pay_basis: 反推使人员费约占预算 45–50%（11 §9.1）；无公开分项数据。
    headcount_by_year:                      # 现役（含纳卡防卫军），用于开局实例化后核对，不直接生成人员
      2010: {total: 63641, armenia: 43641, nk_defence_army: 20000, source: "wp_arm_2010（43,641：陆军 40,421 含义务兵 30,634；空军 3,220）+ wp_nka_2010（未给数，取 wp_nka_2020 区间 18,500–25,000 的中下值，uncertain）"}
      2020: {total: 72943, armenia: 51580, nk_defence_army: 21363, source: "wp_arm_2020 信息框（51,580；另注 21,363 在纳卡指挥下）"}
    politics:
      initial_trust: 0.6
      leadership_hawkishness: {2010: 0.35, 2018: 0.30}   # bal：守势；2018 年领导层更替后见事件 arm_2018_velvet_revolution
      issue_baseline: {hardline_vs_rival: 0.55, defense_budget_increase: 0.55, conscription_reform: 0.40}
    deterrence_initial: {2010: 0.55, 2020: 0.50}   # bal
    rail_fleet_payload_t: 3000                     # t；06 再乘 RailFleetAvailability
    national_truck_payload_t: {none: 1500, partial: 4000, full: 8000}   # t；键 = 11 MobilizationLevel
    transport_confidence: estimated
    transport_basis: "铁路：南高加索铁路（亚美尼亚）年货运量为数百万吨量级、周转数天，在册车皮总载重约 1–2 万 t，可供军用取 3,000 t（bal）。
      公路：none = 中央汽车运输部队平时可调用载重；partial/full = 动员民用货车（按登记货车数的小比例）。06 V3 的纳卡高强度需求约 1,500 t/天作量级核对。"

  - iso3: AZE
    role: belligerent
    playable: true
    rival: ARM
    capital_key_tile: baku
    gdp_musd_by_year:        {2010: 62204, 2011: 75971, 2012: 78798, 2013: 82461, 2014: 82228, 2015: 57473, 2016: 40618, 2017: 43064, 2018: 48534, 2019: 48822, 2020: 42693}
    population_m_by_year:    {2010: 9.054, 2011: 9.173, 2012: 9.296, 2013: 9.417, 2014: 9.535, 2015: 9.649, 2016: 9.758, 2017: 9.854, 2018: 9.940, 2019: 10.024, 2020: 10.093}
    base_budget_musd_by_year: {2010: 1736.0, 2011: 3548.0, 2012: 3670.9, 2013: 3744.5, 2014: 3745.5, 2015: 3140.8, 2016: 1498.5, 2017: 1611.1, 2018: 1722.6, 2019: 1879.2, 2020: 2237.8}
    budget_note: 2011–2015 年翻倍、2016 年腰斩随油价与马纳特贬值（外生背景，不受历史模式影响，11 §4.12）。SIPRI 口径含国防工业部等。
    budget_confidence: stated
    conscription:
      conscription: true
      term_months: 18                       # uncertain：常见说法 18 个月（大学毕业 12 个月）；wp_aze_2010 信息框写 24 个月
      annual_intake_cap: 45000              # estimated：18 岁男性约 9 万/年（wp_aze_2010 reaching 90,416）的一半
      contract_share_target: {2010: 0.25, 2020: 0.30}
      reserve_pool: 300000                  # wp_azelf_2020（“近 15 年服过役 30 万”）
      reserve_general_skill: 0.30
      pay_musd_per_head_year: {conscript: 0.002, contract: 0.010, officer: 0.018, reservist_mobilized: 0.004, civilian: 0.006}
      pay_confidence: estimated
      pay_basis: 估算；人员费约占预算 20–25%（阿方采购占比高）。
    headcount_by_year:
      2010: {total: 66940, source: "wb_pers 81,940 减准军事 15,000（wp_azelf_2020 的准军事数），estimated"}
      2020: {total: 67000, source: "wb_pers 82,000 减准军事 15,000，estimated"}
    politics:
      initial_trust: 0.6
      leadership_hawkishness: {2010: 0.60, 2016: 0.70, 2020: 0.80}   # bal：逐步强硬（2016 四月战争、2020 七月托武兹冲突后）
      issue_baseline: {hardline_vs_rival: 0.65, defense_budget_increase: 0.60, conscription_reform: 0.30}
    deterrence_initial: {2010: 0.45, 2020: 0.60}
    rail_fleet_payload_t: 15000                    # t
    national_truck_payload_t: {none: 3000, partial: 9000, full: 18000}
    transport_confidence: estimated
    transport_basis: "铁路：阿塞拜疆铁路（ADY）年货运量约为亚方数倍（过境油品运输为主），可供军用取 15,000 t（bal）。公路：同亚方方法，按人口与经济规模约 2 倍。"

  # ------------------------------------------------------------------ 外部行为体与供应国
  - {iso3: RUS, role: external_actor, nuclear: true}
  - {iso3: TUR, role: external_actor}
  - {iso3: IRN, role: external_actor}
  - {iso3: ISR, role: supplier_only}
  - {iso3: BLR, role: supplier_only}
