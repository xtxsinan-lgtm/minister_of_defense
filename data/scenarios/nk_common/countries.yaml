# 纳卡战区剧本共享数据：国家参数、预算路径、人力、关系、出口政策、外部大国、信贷、停火模板
# 规格：docs/spec/14_scenario_nk.md §3（数据格式）、docs/spec/11_strategic_layer.md §3（类型定义）。
# 货币：2020 年不变价百万美元（G-10）。换算：当年美元 × 100 / 美国 GDP 平减指数（2020 = 100），平减指数取自
#   World Bank NY.GDP.DEFL.ZS（USA）：https://api.worldbank.org/v2/country/USA/indicator/NY.GDP.DEFL.ZS
# 归一化量 [0,1]；关系值 [-1,1]（11 S-16）。
#
# 来源键：
#   wb_milex  = World Bank MS.MIL.XPND.CD（数据来自 SIPRI Military Expenditure Database）
#               https://api.worldbank.org/v2/country/ARM;AZE/indicator/MS.MIL.XPND.CD
#   wb_gdp    = World Bank NY.GDP.MKTP.CD    wb_pop = SP.POP.TOTL    wb_pers = MS.MIL.TOTL.P1（含准军事，来自 IISS）
#   wp_arm_2010 = https://en.wikipedia.org/w/index.php?oldid=404623264 （Armed Forces of Armenia，2010-12-28，引 IISS 2010）
#   wp_arm_2020 = https://en.wikipedia.org/w/index.php?oldid=978631512 （Armed Forces of Armenia，2020-09-16）
#   wp_nka_2010 = https://en.wikipedia.org/w/index.php?oldid=404448569 （Artsakh Defence Army，2010-12-27）
#   wp_nka_2020 = https://en.wikipedia.org/w/index.php?oldid=977867503 （Artsakh Defence Army，2020-09-11）
#   wp_aze_2010 = https://en.wikipedia.org/w/index.php?oldid=404876835 （Azerbaijani Armed Forces，2010-12-29）
#   wp_azelf_2020 = https://en.wikipedia.org/w/index.php?oldid=943093497 （Azerbaijani Land Forces，2020-02-28，引 IISS 2013 陆军 56,850 + 准军事 15,000 + 预备 300,000）
#   wp_cf2020 = https://en.wikipedia.org/wiki/2020_Nagorno-Karabakh_ceasefire_agreement
#   国家级运力（rail_fleet_payload_t、national_truck_payload_t，14 §3.10 → 06 §4.6 RailFleetPayloadT / NationalTruckPayloadT）：
#     无直接公开数据，confidence: estimated；待核来源：ArmStat《Statistical Yearbook of Armenia》运输章、Azerbaijan Railways (ADY) 年报。

sources_accessed: 2026-10-16

countries:
  # ------------------------------------------------------------------ 交战国（可玩）
