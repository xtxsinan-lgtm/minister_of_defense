  - {a: AZE, b: UKR, value: 0.50, baseline: 0.50, note: 2010 年前后乌克兰为阿方二手装备来源}
  - {a: ARM, b: GEO, value: 0.30, baseline: 0.30}
  - {a: AZE, b: GEO, value: 0.50, baseline: 0.50}
  - {a: ARM, b: CHN, value: 0.20, baseline: 0.20}
  - {a: AZE, b: CHN, value: 0.20, baseline: 0.20}
  - {a: ARM, b: CZE, value: 0.10, baseline: 0.10}
  - {a: AZE, b: CZE, value: 0.20, baseline: 0.20}
  - {a: ARM, b: SRB, value: 0.10, baseline: 0.10}
  - {a: AZE, b: SRB, value: 0.20, baseline: 0.20}
  - {a: ARM, b: MDA, value: 0.10, baseline: 0.10}
  - {a: AZE, b: MDA, value: 0.10, baseline: 0.10}

tension:
  - {a: ARM, b: AZE, score_by_start: {nk_2010: 0.45, nk_2020: 0.80}, baseline: 0.40, note: 冻结冲突常态为“紧张”；2020 年 7 月托武兹冲突后处于危机}

# ------------------------------------------------------------------ 出口政策（11 ExportPolicy）
# willingness ∈ [-1,1]；max_sensitivity ∈ 0..3（敏感度定义见 11 §3.3 与 procurement.yaml）
export_policies:
  RUS: {willingness: {ARM: 0.3, AZE: 0.2}, max_sensitivity: {ARM: 3, AZE: 3}, end_use_restriction: false,
        note: 俄同时向双方出售（亚：伊斯坎德尔、Smerch、Tor-M2KM、Su-30SM；阿：T-90S、BMP-3、Smerch、TOS-1A、S-300PMU-2）}
  TUR: {willingness: {AZE: 1.0}, max_sensitivity: {AZE: 3, ARM: 0}, note: 对亚方另有 arms_embargo 标志}
  ISR: {willingness: {AZE: 0.8, ARM: -1.0}, max_sensitivity: {AZE: 3, ARM: 0}}
  BLR: {willingness: {AZE: 0.3, ARM: 0.0}, max_sensitivity: {AZE: 3, ARM: 2}}
  UKR: {willingness: {AZE: 0.3, ARM: -0.3}, max_sensitivity: {AZE: 2, ARM: 1}, valid_until_year: 2014, note: 2014 年后乌克兰自身需求激增，二手出口减少（bal）}
  CZE: {willingness: {AZE: 0.0, ARM: 0.0}, max_sensitivity: {AZE: 1, ARM: 1}, note: OSCE 1992 年对交战区的武器禁运建议（不具约束力）以低意愿近似}
  SRB: {willingness: {AZE: 0.1, ARM: 0.0}, max_sensitivity: {AZE: 1, ARM: 1}}
  CHN: {willingness: {AZE: 0.0, ARM: 0.0}, max_sensitivity: {AZE: 2, ARM: 2}}
  MDA: {willingness: {ARM: 0.0, AZE: 0.0}, max_sensitivity: {ARM: 1, AZE: 1}}

# ------------------------------------------------------------------ 外部行为体政策（11 ExternalActorPolicy；14 §4.6）
external_actors:
  RUS:
    stance: {ARM: 0.5, AZE: 0.2}
    max_rung: peacekeeping
    mediation_templates: [nov10_template, freeze_template]
    mediation_first_day: 7
    mediation_interval_days: 7
    supply_in_war: {ARM: 0.7, AZE: 0.5}     # 11 §4.10.4 supplyContinueP 的剧本覆盖值（bal）
    red_lines:
      - id: rus_csto_armenia_proper
        protected: ARM
        tiles: {de_jure: ARM}
        trigger: enemy_ground_forces_enter
        grace_hours: 24
        effects: [{effect: warning, after_hours: 0}, {effect: forced_ceasefire, after_hours: 72}]
        relation_penalty: -0.30
        note: CSTO 只覆盖亚美尼亚法理领土；2020 年战事未越过此线（俄未参战）。
  TUR:
    stance: {AZE: 0.9, ARM: -0.6}
    max_rung: intel_sharing
    mediation_templates: []
    supply_in_war: {AZE: 0.95}
    intel_sharing: {to: AZE, satellites: true, from_year: 2012, note: 05 SatelliteAsset.sharesWith（R-12）；土耳其 Göktürk-2（2012）/Göktürk-1（2016）}
    red_lines:
      - id: tur_nakhchivan
        protected: AZE
        tiles: {region: nakhchivan}
        trigger: enemy_ground_forces_enter
        grace_hours: 24
        effects: [{effect: warning, after_hours: 0}, {effect: forced_ceasefire, after_hours: 72}]
        relation_penalty: -0.30
      - id: tur_aze_proper
        protected: AZE
        tiles: {region: aze_proper_outside_conflict_zone}
        trigger: enemy_ground_forces_enter
        grace_hours: 48
        effects: [{effect: warning, after_hours: 0}, {effect: forced_ceasefire, after_hours: 96}]
        relation_penalty: -0.20
        note: 亚方纵深进攻阿塞拜疆本土（冲突区以外）会引发土方与国际强烈反应（bal 抽象）。
  IRN:
    stance: {ARM: 0.2, AZE: 0.0}
    max_rung: statements
    red_lines:
      - id: irn_araz_spillover
        protected: IRN
        tiles: {region: araz_border_strip}
        trigger: strikes_on_tiles
        grace_hours: 0
        effects: [{effect: warning, after_hours: 0}]
        relation_penalty: -0.05
        note: 2020 年有炮弹/火箭落入伊朗境内的报道（Timeline of the Second Nagorno-Karabakh War，1 Oct 等条目）。只做警告与关系惩罚。

# ------------------------------------------------------------------ 信贷额度（11 CreditLine；事件 GrantCreditLine 授予）
credit_lines:
  - id: rus_arm_loan_2015
    lender: RUS
    borrower: ARM
    limit_musd: 216.6                        # 名义 2 亿美元（2015 年协议，2016 年生效）× 100/92.35（2015 年美国平减指数）
    interest_rate_per_year: 0.03             # estimated：公开报道“3% 年息”的说法，未核实
    grace_years: 3
    repayment_years: 10
    restricted_to_lender_goods: true
    available_from: 2016-02-01
    expires_at: 2019-12-31
    confidence: estimated
  - id: rus_arm_loan_2017
    lender: RUS
    borrower: ARM
    limit_musd: 105.4                        # 1 亿美元 × 100/94.897
    interest_rate_per_year: 0.03
    grace_years: 3
    repayment_years: 10
    restricted_to_lender_goods: true
    available_from: 2017-10-01
    expires_at: 2021-12-31
    confidence: estimated

# ------------------------------------------------------------------ 停火模板（11 §4.8.6 CeasefireTemplate；14 §4.7）
ceasefire_templates:
  - id: nov10_template
    name: “11·10 式”三方声明（俄调停）
    mediator: RUS
    condition: {any: [{tile_controlled_by: {key_tile: shusha, country: AZE}},
                      {share_of_region_controlled: {region: seven_districts, country: AZE, min: 0.5}}]}
    terms:
      ceasefire_line: current_control
      handovers:                              # 史实：亚方撤出阿格达姆（11-20）、克尔巴贾尔（11-25）、拉钦（12-01）区（wp_cf2020）
        - {region: aghdam_district,   from: ARM, to: AZE, days: 10}
        - {region: kalbajar_district, from: ARM, to: AZE, days: 15}
        - {region: lachin_district,   from: ARM, to: AZE, days: 21, except_region: lachin_corridor}
      peacekeeping:
        actor: RUS
        regions: [lachin_corridor, nk_contact_line_arm_side]   # 后者在停火时由 14 §4.7.2 计算
        years: 5                                # wp_cf2020：至少 5 年，可自动延长
        troops: 1960                            # wp_cf2020：1,960 名维和人员（只作显示）
    applies_when_war_day_at_least: 7
  - id: freeze_template
    name: 按现控制线冻结（调停或直接谈判）
    mediator: any
    condition: {always: true}
    terms: {ceasefire_line: current_control, handovers: [], peacekeeping: null}
  - id: local_skirmish_template
    name: 局部冲突停火（2016 年四月战争式，俄调停，4 天）
    mediator: RUS
    condition: {war_scope: limited}
    terms: {ceasefire_line: current_control, handovers: [], peacekeeping: null}
    note: 2016-04-02 至 04-05，俄方斡旋下于莫斯科达成口头停火（wp 2016 Nagorno-Karabakh conflict）。
